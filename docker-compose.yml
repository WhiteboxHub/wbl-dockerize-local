version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: wbl_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wbl_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./wbl-backend
      dockerfile: Dockerfile
    container_name: wbl_backend
    command: uvicorn fapi.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "8000:8000"
    volumes:
      - ./wbl-backend:/app   
    env_file:
      - ./wbl-backend/.env
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=wbl_db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./wbl-frontend
      dockerfile: Dockerfile.dev
    container_name: wbl_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./wbl-frontend:/app
      - /app/node_modules   
    env_file:
      - ./wbl-frontend/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true     
      - WATCHPACK_POLLING=true       
    command: npm run dev
    depends_on:
      - backend

volumes:
  db_data:
