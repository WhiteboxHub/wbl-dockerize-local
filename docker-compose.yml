# docker-compose.yml

services:
  db:
    image: mysql:8.0
    container_name: wbl-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whitebox
    ports:
      - "3307:3306"  # Changed from 3306 to 3307 to avoid conflict
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./wbl-backend
    container_name: wbl-backend
    restart: always
    env_file:
      - ./wbl-backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306           # Inside the container it's still 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: whitebox
      BACKEND_PORT: 8000
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./wbl-frontend
    container_name: wbl-frontend
    restart: always
    env_file:
      - ./wbl-frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
