services:
  db:
    image: mysql:8.0
    container_name: local-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whitebox
    ports:
      - "3307:3306"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./wbl-backend
    container_name: wbl-backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: whitebox
      DB_USER: root
      DB_PASSWORD: root

      SECRET_KEY: local-backend-secret
      ALGORITHM: HS256

      MAIL_SERVER: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: testpassword
      MAIL_FROM: test@example.com
      MAIL_TLS: "true"
      MAIL_SSL: "false"

      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./wbl-frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8080
    container_name: wbl-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-secret
    ports:
      - "3000:8080"
    depends_on:
      - backend
